name: sitemap-shards

# Precompute full-corpus sitemap cursors (scripts/build-sitemap-shards.ts) into
# Firestore _meta/sitemap_shards, so /api/sitemap can enumerate ALL ~19M docs
# without an in-request scan. The route serves the long-tail only once this has
# populated the meta doc; until then it stays static + editorial + recent.
#
# Keyless via Workload Identity Federation (the same GCP_WIF_PROVIDER /
# GCP_SEED_SA as auto-seed; the SA needs Firestore write).
#
# WHY IT DIED, AND WHY A CLOUD RUN JOB WAS NOT THE ANSWER. Run 32463577209
# (2026-08-21) failed after 10.6 min having read 7.5M of 19M ids. The earlier
# note here blamed the job timeout and prescribed a Cloud Run Job; both were
# wrong. The limit is in the client: the Firestore SDK stamps one startTime per
# .stream() call and abandons the query once total_timeout_millis (600s for
# runQuery) has elapsed, surfacing the server's EXECUTION_DEADLINE_EXCEEDED as
# fatal instead of resuming. That budget travels with the code, so the same
# stream would have died in a Cloud Run Job too. The script now walks the
# collection in bounded 100k-doc pages, each with a fresh budget.
#
# COST — this job is armed deliberately, not by default. One full run reads
# every document once: ~19M reads, roughly $11. And the artifact it publishes is
# itself a read amplifier, since 9,485 sub-pages x 2,000 docs means a crawler
# working through the whole index costs another full corpus of reads. On a
# project designed to have no marginal cost, that is an owner's decision, so the
# job no-ops unless the repo variable SITEMAP_SHARDS_ENABLED is set to a truthy
# value. Nothing about the long tail is urgent: ingest is frozen, and fresh
# content is already covered by the editorial and 60 recent-* buckets, which are
# arithmetic and cost nothing.
on:
  schedule:
    - cron: '23 4 1 * *'   # 1st of the month, 04:23 UTC — see COST above
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # WIF

concurrency: sitemap-shards

jobs:
  build:
    runs-on: ubuntu-latest
    # ~23 min at the 13,700 ids/s measured on a GitHub runner; 120 leaves 5x
    # headroom while stopping a wedged run from holding the concurrency group
    # for five and a half hours.
    timeout-minutes: 120
    steps:
      - name: Guard on WIF config and the cost opt-in
        id: guard
        run: |
          ready=true
          if [ -z "${{ vars.GCP_WIF_PROVIDER }}" ]; then
            ready=false
            echo "::warning::sitemap-shards skipped — set repo variables GCP_WIF_PROVIDER + GCP_SEED_SA (Workload Identity Federation)."
          fi
          case "$(echo "${{ vars.SITEMAP_SHARDS_ENABLED }}" | tr '[:upper:]' '[:lower:]')" in
            1|true|yes) ;;
            *)
              ready=false
              echo "::warning::sitemap-shards skipped — long-tail sitemap not armed. A run reads every doc (~19M reads, ~\$11) and the published index makes each full crawl cost another corpus of reads. Set repo variable SITEMAP_SHARDS_ENABLED=true to accept that; see docs/auto-content-ops.md."
              ;;
          esac
          echo "ready=$ready" >> "$GITHUB_OUTPUT"
      - if: steps.guard.outputs.ready == 'true'
        uses: actions/checkout@v4
      - name: Authenticate to GCP (keyless, WIF)
        if: steps.guard.outputs.ready == 'true'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SEED_SA }}
      - if: steps.guard.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - if: steps.guard.outputs.ready == 'true'
        run: npm ci
      - name: Build & store sitemap shards
        if: steps.guard.outputs.ready == 'true'
        env:
          FIREBASE_PROJECT_ID: gptwiki
        run: npx tsx scripts/build-sitemap-shards.ts --apply
