name: Return declined topics to the editorial queue
on:
  pull_request:
    types: [closed]
permissions:
  contents: write
jobs:
  requeue:
    if: >-
      github.event.pull_request.merged == false &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'auto-draft/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Requeue the declined batch
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          stamp="${HEAD_REF#auto-draft/}"
          [[ "$stamp" =~ ^[0-9]{8}-[0-9]{6}$ ]]
          # Only parse the immutable JSON. All executable code comes from main.
          gh api -H 'Accept: application/vnd.github.raw+json' \
            "repos/$GITHUB_REPOSITORY/contents/content/releases/$stamp.json?ref=$HEAD_SHA" |
            jq -ce '[.[].topicKey] | unique | select(length > 0 and all(.[]; type == "string" and test("^[a-z0-9]+(-[a-z0-9]+)*$")))' \
              > "$RUNNER_TEMP/batch-keys.json"
          bash scripts/push-batch-status.sh pending
