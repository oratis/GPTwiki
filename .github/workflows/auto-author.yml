name: auto-author

# Manual-first by design. The plan's for/against review
# (docs/auto-content-cron-plan.md §7) concluded the scheduler stays
# operator-triggered until draft quality is trusted — an unattended daily cron
# that writes to a Google-indexed corpus is a site-wide SEO risk. To go
# unattended LATER, uncomment `schedule:` below as a deliberate, reviewed step.
on:
  workflow_dispatch:
    inputs:
      limit:
        description: 'Max topics to draft this run (hard cap 5)'
        default: '3'
  # schedule:
  #   - cron: '17 3 * * *'   # 03:17 UTC daily — enable ONLY after trusted runs

permissions:
  contents: write
  pull-requests: write

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - name: Generate drafts
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: npx tsx scripts/auto-author.ts --apply --limit=${{ github.event.inputs.limit || '3' }}
      - name: Open PR if drafts changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet -- content/auto-draft.en.ts; then
            echo "No new drafts produced — nothing to open."
            exit 0
          fi
          BRANCH="auto-draft/$(date +%Y%m%d-%H%M%S)"
          git config user.name "gptwiki-bot"
          git config user.email "bot@gptwiki.net"
          git checkout -b "$BRANCH"
          git add content/auto-draft.en.ts
          # --no-verify: skip the husky lint-staged hook rewriting generated data.
          git commit --no-verify -m "auto-author: draft batch (review before seeding)"
          git push -u origin "$BRANCH"
          gh pr create \
            --title "Auto-author drafts — review before seeding" \
            --body "Generated by \`scripts/auto-author.ts\`. **Review facts + sources**, then merge and seed with \`npx tsx scripts/seed-editorial.ts --batch=auto-draft --no-images --apply\`. Rationale + guardrails: docs/auto-content-cron-plan.md."
