<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810" role="img" aria-labelledby="title desc" lang="zh">
<title id="title">同样的条件率，不同的告警组成</title><desc id="desc">1% 缺陷时，90 个真告警和 198 个误报，精确率 31.25%；10% 缺陷时，900 个真告警和 180 个误报，精确率约 83.3%。</desc>
<style>text{font-family:Arial,"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif}</style>
<rect x="0" y="0" width="1440" height="810" rx="0" fill="#f5f7fc" stroke="none"/><rect x="0" y="0" width="14" height="810" rx="0" fill="#3730a3" stroke="none"/>
<text x="56" y="58" font-size="22" fill="#3730a3" text-anchor="start" font-weight="700">读懂数据 / 图解指南</text>
<text x="56" y="119" font-size="43" fill="#18284b" text-anchor="start" font-weight="700">同样的条件率，不同的告警组成</text><text x="56" y="161" font-size="27" fill="#52617a" text-anchor="start" font-weight="400">假设召回率 = 90%，假正例率 = 2%；每根条都表示本组 100% 的告警。</text>
<rect x="56" y="190" width="1328" height="510" rx="20" fill="white" stroke="#dbe3ef"/><rect x="88" y="220" width="22" height="22" rx="0" fill="#3730a3" stroke="none"/><text x="123" y="242" font-size="27" fill="#18284b" text-anchor="start" font-weight="400">真实缺陷</text><rect x="450" y="220" width="22" height="22" rx="0" fill="#a74717" stroke="none"/><text x="485" y="242" font-size="27" fill="#18284b" text-anchor="start" font-weight="400">误报的合格品</text><text x="88" y="354" font-size="30" fill="#18284b" text-anchor="start" font-weight="700">缺陷占比 1%</text><text x="88" y="398" font-size="27" fill="#52617a" text-anchor="start" font-weight="400">告警 288 件</text><rect x="350" y="330" width="296.875" height="95" rx="0" fill="#3730a3" stroke="none"/><rect x="646.875" y="330" width="653.125" height="95" rx="0" fill="#a74717" stroke="none"/><text x="498.4375" y="390" font-size="37" fill="white" text-anchor="middle" font-weight="700">90</text><text x="973.4375" y="390" font-size="37" fill="white" text-anchor="middle" font-weight="700">198</text><text x="350" y="467" font-size="30" fill="#3730a3" text-anchor="start" font-weight="700">告警中的真问题：31.25%</text><text x="88" y="554" font-size="30" fill="#18284b" text-anchor="start" font-weight="700">缺陷占比 10%</text><text x="88" y="598" font-size="27" fill="#52617a" text-anchor="start" font-weight="400">告警 1080 件</text><rect x="350" y="530" width="791.6666666666667" height="95" rx="0" fill="#3730a3" stroke="none"/><rect x="1141.6666666666667" y="530" width="158.3333333333333" height="95" rx="0" fill="#a74717" stroke="none"/><text x="745.8333333333334" y="590" font-size="37" fill="white" text-anchor="middle" font-weight="700">900</text><text x="1220.8333333333335" y="590" font-size="37" fill="white" text-anchor="middle" font-weight="700">180</text><text x="350" y="667" font-size="30" fill="#3730a3" text-anchor="start" font-weight="700">告警中的真问题：83.3%</text>
<line x1="56" y1="732" x2="1384" y2="732" stroke="#dbe3ef" stroke-width="2"/><text x="56" y="772" font-size="22" fill="#52617a" text-anchor="start" font-weight="400">GPTwiki · 原创教学数据</text><text x="1384" y="772" font-size="22" fill="#52617a" text-anchor="end" font-weight="400">定义参考：Google 分类指标</text>
</svg>
