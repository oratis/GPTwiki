<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810" role="img" aria-labelledby="title desc" lang="en">
<title id="title">The respondents do not match the population</title><desc id="desc">The population has 800 commuters and 200 residents. The survey has 100 respondents from each group, overrepresenting residents.</desc>
<style>text{font-family:Arial,"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif}</style>
<rect x="0" y="0" width="1440" height="810" rx="0" fill="#f5f7fc" stroke="none"/><rect x="0" y="0" width="14" height="810" rx="0" fill="#3730a3" stroke="none"/>
<text x="56" y="58" font-size="22" fill="#3730a3" text-anchor="start" font-weight="700">READING DATA / A VISUAL GUIDE</text>
<text x="56" y="119" font-size="43" fill="#18284b" text-anchor="start" font-weight="700">The respondents do not match the population</text><text x="56" y="161" font-size="27" fill="#52617a" text-anchor="start" font-weight="400">Each bar represents 100% of its own group. Labels show counts and shares.</text>
<rect x="56" y="190" width="1328" height="510" rx="20" fill="white" stroke="#dbe3ef"/><rect x="88" y="220" width="22" height="22" rx="0" fill="#3730a3" stroke="none"/><text x="123" y="242" font-size="27" fill="#18284b" text-anchor="start" font-weight="400">Commuters</text><rect x="450" y="220" width="22" height="22" rx="0" fill="#087f8c" stroke="none"/><text x="485" y="242" font-size="27" fill="#18284b" text-anchor="start" font-weight="400">Campus residents</text><text x="88" y="362" font-size="29" fill="#18284b" text-anchor="start" font-weight="700">Target population</text><text x="88" y="407" font-size="27" fill="#52617a" text-anchor="start" font-weight="400">N = 1,000</text><rect x="350" y="330" width="760" height="110" rx="0" fill="#3730a3" stroke="none"/><rect x="1110" y="330" width="189.99999999999997" height="110" rx="0" fill="#087f8c" stroke="none"/><text x="730" y="398" font-size="32" fill="white" text-anchor="middle" font-weight="700">800 / 80%</text><text x="1205" y="398" font-size="28" fill="white" text-anchor="middle" font-weight="700">200 / 20%</text><text x="88" y="582" font-size="29" fill="#18284b" text-anchor="start" font-weight="700">Respondents</text><text x="88" y="627" font-size="27" fill="#52617a" text-anchor="start" font-weight="400">n = 200</text><rect x="350" y="550" width="475" height="110" rx="0" fill="#3730a3" stroke="none"/><rect x="825" y="550" width="475" height="110" rx="0" fill="#087f8c" stroke="none"/><text x="587.5" y="618" font-size="32" fill="white" text-anchor="middle" font-weight="700">100 / 50%</text><text x="1062.5" y="618" font-size="32" fill="white" text-anchor="middle" font-weight="700">100 / 50%</text>
<line x1="56" y1="732" x2="1384" y2="732" stroke="#dbe3ef" stroke-width="2"/><text x="56" y="772" font-size="22" fill="#52617a" text-anchor="start" font-weight="400">GPTwiki • Original teaching data</text><text x="1384" y="772" font-size="22" fill="#52617a" text-anchor="end" font-weight="400">Method: Statistics Canada sampling guidance</text>
