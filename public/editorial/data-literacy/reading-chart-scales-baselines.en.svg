<text x="56" y="58" font-size="22" fill="#3730a3" text-anchor="start" font-weight="700">READING DATA / A VISUAL GUIDE</text>
<text x="56" y="119" font-size="43" fill="#18284b" text-anchor="start" font-weight="700">Same values. Two visual impressions.</text><text x="56" y="161" font-size="27" fill="#52617a" text-anchor="start" font-weight="400">Satisfaction rises from 48% to 52%: +4 percentage points, about +8.3% relative.</text>
