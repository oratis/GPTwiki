<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810" role="img" aria-labelledby="title desc" lang="en">
<title id="title">Same values. Two visual impressions.</title><desc id="desc">Both panels show A at 48% and B at 52%. The left axis starts at zero; the right starts at 45%, making the visible bar heights have a ratio of 7 to 3.</desc>
