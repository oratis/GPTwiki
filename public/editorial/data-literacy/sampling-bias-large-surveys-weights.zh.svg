<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810" role="img" aria-labelledby="title desc" lang="zh">
<title id="title">加权修正的是群体比例</title><desc id="desc">回答者权重各一半，合计支持率 50%；总体权重为通勤 80%、住校 20%，合计支持率 32%。加权有效依赖组内代表性假设。</desc>
<style>text{font-family:Arial,"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif}</style>
<rect x="0" y="0" width="1440" height="810" rx="0" fill="#f5f7fc" stroke="none"/><rect x="0" y="0" width="14" height="810" rx="0" fill="#3730a3" stroke="none"/>
<text x="56" y="58" font-size="22" fill="#3730a3" text-anchor="start" font-weight="700">读懂数据 / 图解指南</text>
<text x="56" y="119" font-size="43" fill="#18284b" text-anchor="start" font-weight="700">加权修正的是群体比例</text><text x="56" y="161" font-size="27" fill="#52617a" text-anchor="start" font-weight="400">教学假设：通勤组支持率 20%，住校组 80%；各组回答者代表各自群体。</text>
<rect x="56" y="190" width="636" height="510" rx="20" fill="white" stroke="#dbe3ef"/><rect x="748" y="190" width="636" height="510" rx="20" fill="white" stroke="#dbe3ef"/><text x="88" y="241" font-size="30" fill="#3730a3" text-anchor="start" font-weight="700">按回答人数直接汇总</text><text x="88" y="294" font-size="26" fill="#52617a" text-anchor="start" font-weight="400">组内支持率保持不变</text><rect x="88" y="327" width="572" height="54" rx="12" fill="#edf2ff" stroke="none"/><text x="374" y="363" font-size="28" fill="#3730a3" text-anchor="middle" font-weight="600">0.50 × 20% = 10%</text><text x="374" y="426" font-size="34" fill="#52617a" text-anchor="middle" font-weight="400">+</text><rect x="88" y="448" width="572" height="54" rx="12" fill="#e7f5f3" stroke="none"/><text x="374" y="484" font-size="28" fill="#087f8c" text-anchor="middle" font-weight="600">0.50 × 80% = 40%</text><text x="374" y="589" font-size="76" fill="#3730a3" text-anchor="middle" font-weight="700">50%</text><text x="374" y="651" font-size="26" fill="#52617a" text-anchor="middle" font-weight="400">这 200 位回答者的支持率</text><text x="780" y="241" font-size="30" fill="#087f8c" text-anchor="start" font-weight="700">按总体比例加权</text><text x="780" y="294" font-size="26" fill="#52617a" text-anchor="start" font-weight="400">组内支持率保持不变</text><rect x="780" y="327" width="572" height="54" rx="12" fill="#edf2ff" stroke="none"/><text x="1066" y="363" font-size="28" fill="#3730a3" text-anchor="middle" font-weight="600">0.80 × 20% = 16%</text><text x="1066" y="426" font-size="34" fill="#52617a" text-anchor="middle" font-weight="400">+</text><rect x="780" y="448" width="572" height="54" rx="12" fill="#e7f5f3" stroke="none"/><text x="1066" y="484" font-size="28" fill="#087f8c" text-anchor="middle" font-weight="600">0.20 × 80% = 16%</text><text x="1066" y="589" font-size="76" fill="#087f8c" text-anchor="middle" font-weight="700">32%</text><text x="1066" y="651" font-size="26" fill="#52617a" text-anchor="middle" font-weight="400">与设定的总体支持率一致</text>
<line x1="56" y1="732" x2="1384" y2="732" stroke="#dbe3ef" stroke-width="2"/><text x="56" y="772" font-size="22" fill="#52617a" text-anchor="start" font-weight="400">GPTwiki · 原创教学数据</text><text x="1384" y="772" font-size="22" fill="#52617a" text-anchor="end" font-weight="400">方法参考：U.S. Census Bureau 非抽样误差</text>
</svg>
