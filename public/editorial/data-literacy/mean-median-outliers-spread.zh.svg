<text x="56" y="58" font-size="22" fill="#3730a3" text-anchor="start" font-weight="700">读懂数据 / 图解指南</text>
<text x="56" y="119" font-size="43" fill="#18284b" text-anchor="start" font-weight="700">均值和中位数相同，体验仍可不同</text><text x="56" y="161" font-size="27" fill="#52617a" text-anchor="start" font-weight="400">两组均值 = 20，中位数 = 20；每个圆点代表一笔订单。</text>
