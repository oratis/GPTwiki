<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810" role="img" aria-labelledby="title desc" lang="en">
<title id="title">Same detection rates. Different alert quality.</title><desc id="desc">At 1% defects, 90 true alerts and 198 false alarms give 31.25% precision. At 10% defects, 900 true alerts and 180 false alarms give about 83.3%.</desc>
<style>text{font-family:Arial,"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif}</style>
<rect x="0" y="0" width="1440" height="810" rx="0" fill="#f5f7fc" stroke="none"/><rect x="0" y="0" width="14" height="810" rx="0" fill="#3730a3" stroke="none"/>
<text x="56" y="58" font-size="22" fill="#3730a3" text-anchor="start" font-weight="700">READING DATA / A VISUAL GUIDE</text>
<text x="56" y="119" font-size="43" fill="#18284b" text-anchor="start" font-weight="700">Same detection rates. Different alert quality.</text><text x="56" y="161" font-size="27" fill="#52617a" text-anchor="start" font-weight="400">Assume recall = 90% and false-positive rate = 2%. Each bar shows 100% of alerts.</text>
<rect x="56" y="190" width="1328" height="510" rx="20" fill="white" stroke="#dbe3ef"/><rect x="88" y="220" width="22" height="22" rx="0" fill="#3730a3" stroke="none"/><text x="123" y="242" font-size="27" fill="#18284b" text-anchor="start" font-weight="400">Real defects</text><rect x="450" y="220" width="22" height="22" rx="0" fill="#a74717" stroke="none"/><text x="485" y="242" font-size="27" fill="#18284b" text-anchor="start" font-weight="400">False alarms</text><text x="88" y="354" font-size="30" fill="#18284b" text-anchor="start" font-weight="700">1% defective</text><text x="88" y="398" font-size="27" fill="#52617a" text-anchor="start" font-weight="400">288 alerts</text><rect x="350" y="330" width="296.875" height="95" rx="0" fill="#3730a3" stroke="none"/><rect x="646.875" y="330" width="653.125" height="95" rx="0" fill="#a74717" stroke="none"/><text x="498.4375" y="390" font-size="37" fill="white" text-anchor="middle" font-weight="700">90</text><text x="973.4375" y="390" font-size="37" fill="white" text-anchor="middle" font-weight="700">198</text><text x="350" y="467" font-size="30" fill="#3730a3" text-anchor="start" font-weight="700">Real defects among alerts: 31.25%</text><text x="88" y="554" font-size="30" fill="#18284b" text-anchor="start" font-weight="700">10% defective</text><text x="88" y="598" font-size="27" fill="#52617a" text-anchor="start" font-weight="400">1080 alerts</text><rect x="350" y="530" width="791.6666666666667" height="95" rx="0" fill="#3730a3" stroke="none"/><rect x="1141.6666666666667" y="530" width="158.3333333333333" height="95" rx="0" fill="#a74717" stroke="none"/><text x="745.8333333333334" y="590" font-size="37" fill="white" text-anchor="middle" font-weight="700">900</text><text x="1220.8333333333335" y="590" font-size="37" fill="white" text-anchor="middle" font-weight="700">180</text><text x="350" y="667" font-size="30" fill="#3730a3" text-anchor="start" font-weight="700">Real defects among alerts: 83.3%</text>
<line x1="56" y1="732" x2="1384" y2="732" stroke="#dbe3ef" stroke-width="2"/><text x="56" y="772" font-size="22" fill="#52617a" text-anchor="start" font-weight="400">GPTwiki • Original teaching data</text><text x="1384" y="772" font-size="22" fill="#52617a" text-anchor="end" font-weight="400">Definitions: Google classification metrics</text>
