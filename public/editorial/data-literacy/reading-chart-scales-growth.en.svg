<text x="56" y="58" font-size="22" fill="#3730a3" text-anchor="start" font-weight="700">READING DATA / A VISUAL GUIDE</text>
<text x="56" y="119" font-size="43" fill="#18284b" text-anchor="start" font-weight="700">The same doubling process: curve or line</text><text x="56" y="161" font-size="27" fill="#52617a" text-anchor="start" font-weight="400">Four observations: 10 → 20 → 40 → 80. Only the vertical scale changes.</text>
