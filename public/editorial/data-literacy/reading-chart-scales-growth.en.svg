="2"/><text x="456" y="430" font-size="28" fill="#18284b" text-anchor="middle" font-weight="700">40</text><text x="456" y="625" font-size="26" fill="#52617a" text-anchor="middle" font-weight="400">2</text><circle cx="606" cy="310" r="9" fill="#3730a3" stroke="white" stroke-width="2"/><text x="606" y="290" font-size="28" fill="#18284b" text-anchor="middle" font-weight="700">80</text><text x="606" y="625" font-size="26" fill="#52617a" text-anchor="middle" font-weight="400">3</text><text x="381" y="675" font-size="27" fill="#52617a" text-anchor="middle" font-weight="400">Time (equal intervals)</text><text x="780" y="238" font-size="29" fill="#087f8c" text-anchor="start" font-weight="700">Log scale: equal steps = ×2</text><text x="780" y="277" font-size="24" fill="#52617a" text-anchor="start" font-weight="400">Count</text><line x1="848" y1="590" x2="1298" y2="590" stroke="#dbe3ef" stroke-width="2"/><text x="828" y="598" font-size="26" fill="#52617a" text-anchor="end" font-weight="400">10</text><line x1="848" y1="496.6666666666667" x2="1298" y2="496.6666666666667" stroke="#dbe3ef" stroke-width="2"/><text x="828" y="504.6666666666667" font-size="26" fill="#52617a" text-anchor="end" font-weight="400">20</text><line x1="848" y1="403.33333333333337" x2="1298" y2="403.33333333333337" stroke="#dbe3ef" stroke-width="2"/><text x="828" y="411.33333333333337" font-size="26" fill="#52617a" text-anchor="end" font-weight="400">40</text><line x1="848" y1="310" x2="1298" y2="310" stroke="#dbe3ef" stroke-width="2"/><text x="828" y="318" font-size="26" fill="#52617a" text-anchor="end" font-weight="400">80</text><polyline points="848,590 998,496.6666666666667 1148,403.33333333333337 1298,310" fill="none" stroke="#087f8c" stroke-width="5"/><circle cx="848" cy="590" r="9" fill="#087f8c" stroke="white" stroke-width="2"/><text x="848" y="570" font-size="28" fill="#18284b" text-anchor="middle" font-weight="700">10</text><text x="848" y="625" font-size="26" fill="#52617a" text-anchor="middle" f